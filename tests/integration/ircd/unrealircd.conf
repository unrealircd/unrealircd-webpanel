/* UnrealIRCd configuration for the panel integration tests ONLY.
 * The passwords and cloak keys below are test values, never use them on a real network.
 */
loadmodule "cloak_sha256";
include "modules.default.conf";
include "rpc.modules.default.conf";
include "help/help.conf";
include "badwords.conf";
include "spamfilter.conf";
include "operclass.default.conf";
include "snomasks.default.conf";

me { name "irc.test"; info "Panel test server"; sid "001"; }
admin { "Test"; }

class clients { pingfreq 90; maxclients 1000; sendq 200k; recvq 8000; }
class servers { pingfreq 60; connfreq 15; maxclients 10; sendq 20M; }

allow { mask *; class clients; maxperip 1000; }

listen { ip *; port 6667; }
listen { ip *; port 6697; options { tls; } }
listen { ip *; port 8600; options { rpc; } }

rpc-user adminpanel { match { ip *; } rpc-class full; password "test-rpc-password"; }

oper bobsmith { class clients; mask *; password "operpass"; operclass netadmin; swhois "is a Network Administrator"; vhost netadmin.test; }

log { source { all; !debug; !join.LOCAL_CLIENT_JOIN; !join.REMOTE_CLIENT_JOIN; !part.LOCAL_CLIENT_PART; !part.REMOTE_CLIENT_PART; !kick.LOCAL_CLIENT_KICK; !kick.REMOTE_CLIENT_KICK; } destination { file "ircd.log" { maxsize 100M; } } }
log { source { all; !debug; } destination { memory { max-lines 1000; max-time 7d; } } }

set {
	network-name "TestNet";
	default-server "irc.test";
	services-server "services.test";
	stats-server "stats.test";
	help-channel "#help";
	kline-address "admin@irc.test";
	allowed-channelchars any;
	cloak-prefix "Test";
	prefix-quit "Quit";
	cloak-keys {
		"7M3qXBbX5gSW16WZqTLinv6YR7G1lBD80u8zDnU8zrZAY2N0eEEhbkU1JI7f3hg9r4Yf3HTXL7BS8aj7UmVglwW6Y2";
		"2J5GpUQbUKPGIlByWBXBzvtXGj3aFPTF3JEC1mH0IzuK2jc0vD1bGqNy2suGLvg5TERhrGponcvMWOgNiCYcOmJope";
		"UH6jrfynqw5m00wnhGAXB2c6iPAZ6kqbFQlADMenJBt0XSPkTI2AM2BL0TIF1Co011tBkjOEBy5V4CxhQemQW0drPZ";
	}
	anti-flood { everyone { connect-flood 255:1; } }
	anti-spam-quit-message-time 0s;
	/* test clients connect without TLS; let the demo's oper log in anyway */
	plaintext-policy { oper allow; }
	connthrottle { known-users { minimum-reputation-score 1; } new-users { local-throttle 1000:1; global-throttle 1000:1; } }
}
